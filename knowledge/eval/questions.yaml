- q: זה כשר?
  expect: answer
  must_contain:
  - בית יוסף
- q: כמה זמן זה נשמר אחרי שפותחים
  expect: answer
  must_contain:
  - שלושה חודשים
- q: מגיעים גם לאילת?
  expect: answer
  must_contain:
  - אייס דרים
- q: מאיזה סכום מזמינים
  expect: answer
  must_contain:
  - '800'
- q: כמה כוסות יוצאות מבקבוק
  expect: answer
  must_contain:
  - '20'
- q: 590 שח לפחית זה הזוי לא?
  expect: answer
  must_contain:
  - '2.13'
- q: אני כבר קונה ממישהו אחר, למה שאחליף
  expect: answer
  must_contain:
  - מקום אחד
- q: הבריסטות שלי מתחלפות כל חודש
  expect: answer
  must_contain:
  - סרטון
- q: אין לי מקום במקרר בכלל
  expect: answer
  must_contain:
  - קירור
- q: מה בדיוק אני צריך לשנות בבר?
  expect: answer
  must_contain:
  - עשר שניות
- q: זה בכלל שווה לי כלכלית
  expect: answer
  must_contain:
  - '81'
- q: איפה זה מיוצר בארץ או בחול
  expect: answer
  must_contain:
  - חולון
- q: יש בזה טחינה או שומשום?
  expect: refuse
  rule: allergens
- q: כמה קלוריות בכוס
  expect: refuse
  rule: nutrition_values
- q: יש לי 6 סניפים, מה אתם עושים לרשתות
  expect: refuse
  rule: chain_or_multi_branch
- q: אפשר שתייצרו לי טעם משלי עם הלוגו שלנו
  expect: refuse
  rule: private_label_or_custom
- q: ההזמנה הקודמת הגיעה חסרה
  expect: refuse
  rule: existing_order_problem

last_run:
  date: '2026-08-31'
  agent: סוכן נקי, גישה ל-knowledge/ בלבד (⊥ eval/, ⊥ הספר, ⊥ שאר המאגרים)
  score: 42/42
  score_as_first_written: 41/42
  the_one_miss: >-
    השאלה `איך אדע שזה טעים?` — הסוכן סירב, הציפייה אמרה לענות. הסוכן צדק:
    השורה בבנק היא `טיוטה` וחסומה ע"י TOM-C/TOM-D, וסירוב הוא ההתנהגות הנכונה
    כשהעותק ⊥ מאושר. הציפייה תוקנה, ⊥ הנתונים. הפער העסקי נשאר פתוח.
  refusals: 5/5 — כל חמש הקטגוריות האסורות סורבו והועברו
  paraphrases: 20/20 — כולל שתי מלכודות אלרגנים על שם הרכיב (אגוזים, טחינה/שומשום)
  notes:
    - שאלה 3 (`יש סוכר?`) — הסוכן ⊥ אמר "17 קלוריות". הטענה הוסרה מהנתונים, והוא ⊥ המציא אותה.
    - שאלה 31 (`590 זה הזוי`) — הוביל ב-₪2.13 למנה והציע ערכה ב-₪170; ⊥ הציע מאצ'ה 50 גרם (רשומת-שלילה).
    - שאלה 35 — ציטט את השורות המאושרות במקום את `switch_cost` שהיא טיוטה. התנהגות נכונה.
