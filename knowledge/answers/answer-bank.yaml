    תשובה: >-
      תמציות תה טבעיות ואבקות — מאצ'ה, אובה ומאצ'ה שחורה. בנוסף מחיות פרי
      איטלקיות ועזרי הכנה.
    קטגוריה: מוצר
    סטטוס: מאושר
