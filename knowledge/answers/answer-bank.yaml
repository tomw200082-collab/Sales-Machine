# GT — בנק התשובות. מקור יחיד. הגיליון שהמערכת קוראת נבנה מכאן, ⊥ להפך.
# ⊥ ליצור בנק תשובות שני בשום מקום. שני בנקים = כישלון D3.
#
# העמודות שהמערכת דורשת: שאלה · מילות מפתח · תשובה · קטגוריה · סטטוס · תאריך אישור
# סטטוס:
#   מאושר         — נאמר ללקוח כמו שכתוב.
#   טיוטה         — נכתב כאן, ⊥ נאמר ללקוח לפני אישור אלכסנדר/טום (TOM-F).
#   העברה         — אין תשובה. הסוכן מעביר. זו תשובה תקפה, ⊥ חור.
card:
  id: answers/answer-bank
  title: בנק התשובות — מה מותר לענות, ומה עובר לאלכסנדר
  type: answer-bank
  authority: per-entry
  date: 2026-08-31
  freshness: review_30d
  source: ספר העבודה §07 (17 תשובות) + הרחבה 2026-08-31 לפערי האאוטבאונד
  columns: [שאלה, מילות מפתח, תשובה, קטגוריה, סטטוס, תאריך אישור]
  precedence: >-
    boundaries/refusals.yaml נבדק ראשון. אם נדלק כלל סירוב — הוא גובר על כל
    שורה כאן, גם על שורה "מאושר".
  approval: >-
    שורות "טיוטה" נכתבו בסשן 2026-08-31 ומחכות לאישור אלכסנדר (או טום, לפי
    החלטתו — TOM-F). עד אז ⊥ נאמרות ללקוח.

