  # ============================================ הרחבה 2026-08-31 — פערי אאוטבאונד
  - id: switch_cost
    שאלה: מה אני בפועל צריך לשנות כדי לעבור אליכם?
    מילות מפתח: [לעבור אליכם, מה צריך לשנות, כמה עבודה, להחליף ספק, מעבר, זמן הכנה]
    תשובה: >-
      פחות ממה שנשמע. חליטה קרה: כוס, קרח, 50 מ״ל תמצית, מים או סודה — עשר
      שניות, בלי מכונה. הבקבוק סגור לא צריך קירור, אז זה לא לוקח מקום במקרר.
      צ'אי זה אותו בקבוק, אותה מנה, אותה פעולה — ברמן שיודע להכין חליטה כבר
      יודע להכין צ'אי. רק אבקות דורשות משהו נוסף: מקציף או מטרפה, וחלב.
    קטגוריה: התנגדות
    סטטוס: טיוטה
    תאריך אישור: null
    source: ספר העבודה §01 "הקו שחשוב להבין" + §05 שלב 02 + §06
    date: '2026-08-31'
    authority: doc_confirmed

  - id: switch_no_replace
    שאלה: אני לא רוצה להחליף את מה שעובד לי
    מילות מפתח: [לא רוצה להחליף, עובד לי טוב, למה לשנות, בשביל מה, מרוצה]
    תשובה: >-
      גם אני לא ממליץ להחליף. הקטגוריה הזאת יושבת במקום שהיה ריק — בין הקפה
      למשקאות המוכנים מהמקרר — והיא תוספת לתפריט, לא תחליף לכלום. אפשר
      להתחיל מבקבוק אחד ולראות מה קורה.
    קטגוריה: התנגדות
    סטטוס: טיוטה
    תאריך אישור: null
    source: ספר העבודה §01 + §07 "למי זה מתאים"
    date: '2026-08-31'
