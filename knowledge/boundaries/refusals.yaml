# GT — שכבת הבטיחות. הפרק החשוב בספר, כנתונים.
# חוק ברירת המחדל: שאלה שלא נתפסה ע"י שום כלל ואין לה תשובה מאושרת ב-answers/
# בנק-התשובות ⇒ refuse_and_transfer. ⊥ מאמץ-הכי-טוב, ⊥ הסקה, ⊥ "נראה לי".
card:
  id: boundaries/refusals
  title: הגבולות — מה אף פעם לא עונים, ומה אומרים במקום
  type: refusal-rules
  authority: per-entry
  date: 2026-08-31
  freshness: stable
  source: >-
    ספר העבודה §08 "הגבולות" + Sales-Machine/CLAUDE.md §Stop conditions
    + gt-acquisition-os/CLAUDE.md §Absolute non-negotiables
  default: refuse_and_transfer
  escalation_targets:
    alexander: {name: אלכסנדר, role: מכירות — כל מה שמסחרי או לא-מאושר}
    tom: {name: טום, role: החלטות מחיר, תנאים, מדיניות}
  how_to_match: >-
    כל כלל נבדק על טקסט השאלה. patterns הן מחרוזות משנה (case-insensitive);
    כלל נדלק אם נמצאה לפחות אחת. הכללים נבדקים לפני בנק התשובות — סירוב גובר
    על תשובה, תמיד.

rules:
  - id: allergens
    severity: critical
    reason: >-
      מסעדה מסתמכת על מה שאנחנו אומרים כדי לענות לסועד עם אלרגיה. במחירון יש
      מחית פיסטוק ומשקה שומשום שחור — שני אלרגנים מוכרזים. תשובה שגויה כאן היא
      סיכון בריאותי, ⊥ אי-נוחות מסחרית.
    patterns: [אלרג, alerg, allerg, גלוטן, אגוז, אגוזים, בוטן, בוטנים, פיסטוק,
               שקד, שקדים, שומשום, טחינה, סויה, לקטוז, חלב פרה, ביצה, ביצים,
               צליאק, קזאין, סולפיט, חיטה, דגים, סלרי, חרדל, לופין, רכיכות,
               "יש בזה", "מכיל", "אפשר לתת למישהו ש"]
    say_he: >-
      על אלרגנים אני לא עונה מהראש — זה משהו שאתם מגישים לסועד ואני לא רוצה
      שתסתמכו על ניחוש. אני מעביר אותך לאלכסנדר עם השאלה המדויקת ותקבל תשובה
      מוסמכת בכתב.
    escalate_to: alexander
    never: ["נראה לי שאין", "אין בזה", "זה בטוח", "אין אלרגנים"]
    source: ספר העבודה §08 + הערת האלרגנים בסוף הפרק
    date: '2026-08-31'
    authority: doc_confirmed

  - id: health_claims
    severity: critical
    reason: >-
      DETOX הוא שם מותג וזה בסדר. משפט שמבטיח מה המשקה עושה לגוף הוא חשיפה
      רגולטורית. ⊥ אומרים ו⊥ כותבים.
    patterns: [מנקה רעלים, ניקוי רעלים, דיטוקס אמיתי, מחזק חסינות, חיסון,
               מוריד במשקל, הרזיה, דיאטה, סוכרתי, סוכרת, לחץ דם, כולסטרול,
               בריא, מרפא, תרופה, "טוב ל", "עוזר ל", "מתאים להריון", הריון,
               הנקה, ילדים, תינוק, נוגד חמצון, אנטי אייג]
    say_he: >-
      אנחנו לא טוענים טענות בריאותיות על המוצרים. מה שכן אפשר לומר: המוצרים ללא
      חומרים משמרים, ללא צבעי מאכל וללא תמציות טעם, וזמינים גם ללא סוכר. כל שאלה
      תזונתית או רפואית — אני מעביר לאלכסנדר.
    escalate_to: alexander
    source: ספר העבודה §08 + Sales-Machine/CLAUDE.md rule 1 (inferred ⊥ policy)
    date: '2026-08-31'
    authority: doc_confirmed

  - id: nutrition_values
    severity: high
    reason: >-
      הספר נוקב ב"כ-17 קלוריות ל-100 מ״ל משקה מוכן" — נתון בודד ללא מקור מאומת
      בשום קובץ. ערכים תזונתיים אחרים (חלבון, נתרן, סוכר בגרמים) אינם קיימים כלל.
    patterns: [ערכים תזונתיים, טבלת סימון, סימון תזונתי, קלוריות, קלוריה, קלורי,
               חלבון, נתרן, פחמימ, שומן, כמה סוכר בגרמים, "כמה גרם סוכר", ויטמין,
               "כמה קפאין", מ״ג קפאין, מג קפאין]
    say_he: >-
      ערכים תזונתיים מדויקים אני לא מוסר מהראש. אני מעביר לאלכסנדר ותקבל את
      הנתון הרשמי.
    escalate_to: alexander
    source: הספר §08 + ממצא CLAIM-3 (קלוריות ללא מקור), evidence 2026-08-31
    date: '2026-08-31'
    authority: doc_confirmed

  - id: unlisted_price
    severity: critical
    reason: מחיר שלא במחירון המאושר הוא מחיר שהמצאנו. אין מצב שבו זה בסדר.
    patterns: [כמה עולה ה, מה המחיר של, תמחיר לי, מחיר מיוחד, "כמה תעלה לי"]
    condition: only_if_product_not_in_products_catalog_or_customer_facing_false
    say_he: >-
      את המוצר הזה אני לא מתמחר כאן — אני מעביר לאלכסנדר והוא יחזור אליך עם
      מחיר מדויק.
    escalate_to: alexander
    source: ספר העבודה §08 "לא עושים, בשום מצב"
    date: '2026-08-31'
    authority: doc_confirmed

  - id: discount_or_terms
    severity: critical
    reason: >-
      מדרגות ההנחה לפי צריכה חודשית קיימות במסלול התשלום המיידי — בלי מספרים.
      אין מספר לתת, ולכן אין תשובה לתת. (TOM-A.3)
    patterns: [הנחה, הנחות, מוזל, זול יותר, מחיר מיוחד, מדרגות, כמות גדולה,
               תנאי תשלום, שוטף, שוטף פלוס, אשראי, קרדיט, מסגרת אשראי,
               תשלומים, ערבות, ערבויות, "כמה אחוז"]
    say_he: >-
      הנחות ותנאי תשלום נקבעים מול אלכסנדר, לא אצלי. אני מעביר לו את הפרטים
      שלך והוא חוזר אליך.
    escalate_to: alexander
    source: ספר העבודה §08 + §09 "מדרגות ההנחה — עדיין לא מוגדרות"
    date: '2026-08-31'
    authority: doc_confirmed

  - id: delivery_date
    severity: high
    reason: >-
      "פעמיים בשבוע לכל אזור" היא תדירות, ⊥ תשובה ל"מתי זה מגיע". מספר ימים
      מהזמנה עד הגעה — לא מוגדר. (TOM-A.2)
    patterns: [מתי יגיע, מתי זה מגיע, כמה ימים, תוך כמה זמן, זמן אספקה,
               אספקה מהירה, דחוף, מחר, היום, "עד מתי", תאריך אספקה]
    say_he: >-
      אספקה לכל הארץ דרך המפיץ שלנו אייס דרים, שמגיע לכל אזור לפחות פעמיים
      בשבוע. תאריך מדויק להזמנה שלך — אלכסנדר ייתן, אני לא רוצה להבטיח יום
      ולפספס.
    escalate_to: alexander
    source: ספר העבודה §08 + §09
    date: '2026-08-31'
    authority: doc_confirmed

  - id: starter_packages
    severity: high
    reason: תוכן ומחיר שלוש חבילות ההתחלה לא סגורים. (TOM-A.1)
    patterns: [חבילת התחלה, חבילות התחלה, ערכת התחלה, מה יש בחבילה,
               כמה עולה החבילה, "החבילה הכי", starter]
    say_he: >-
      יש שלוש חבילות התחלה, וכל אחת כוללת מוצרים לטעימות, את הציוד, הוראות
      הכנה, תפריט משקאות והדרכה לצוות. את התוכן והמחיר המדויקים של כל חבילה
      אלכסנדר יעביר לך — אני לא רוצה למסור מספר שישתנה.
    escalate_to: alexander
    source: ספר העבודה §05 שלב 05 + §09
    date: '2026-08-31'
    authority: doc_confirmed

  - id: chain_or_multi_branch
    severity: high
    reason: רשת או יותר מסניף אחד — שיחה מסחרית אחרת לגמרי. עוברת כמו שהיא.
    patterns: [רשת, סניפים, סניף נוסף, כמה סניפים, כל הסניפים, מטה, זכיינות,
               זכיין, франч, franchise, "יש לנו עוד"]
    say_he: >-
      רשת אני מעביר ישירות לאלכסנדר — יש שם דברים שנסגרים ברמת המטה ולא ברמת
      הסניף. אשמח לקחת ממך את שם הרשת ומספר הסניפים כדי שהוא יגיע מוכן.
    escalate_to: alexander
    source: ספר העבודה §08
    date: '2026-08-31'
    authority: doc_confirmed

  - id: existing_order_problem
    severity: high
    reason: תלונה או בעיה בהזמנה קיימת — ⊥ שיחת מכירה. עוברת מיד.
    patterns: [לא הגיע, חסר, שבור, פגום, תלונה, החזר, זיכוי, טעות בהזמנה,
               הזמנתי ולא, מקולקל, פג תוקף, "לא קיבלתי"]
    say_he: >-
      מצטער על זה. אני מעביר את הפרטים לאלכסנדר עכשיו כדי שייקח את זה לטיפול
      ישירות מולך.
    escalate_to: alexander
    source: ספר העבודה §08
    date: '2026-08-31'
    authority: doc_confirmed

  - id: exclusivity_or_commitment
    severity: high
    reason: לא ידוע אם יש חוזה, מינימום חודשי או בלעדיות אזורית. (TOM-A.4)
    patterns: [בלעדיות, חוזה, התחייבות, מינימום חודשי, כמה זמן מחויב,
               לצאת מהעסקה, ביטול הסכם, אזור, "רק אצלי"]
    say_he: >-
      התחייבות ובלעדיות הן דברים שאלכסנדר סוגר, לא אני. אני מעביר לו.
    escalate_to: alexander
    source: ספר העבודה §09
    date: '2026-08-31'
    authority: doc_confirmed

  - id: stock_or_lead_time_commitment
    severity: high
    reason: >-
      אמת המלאי חיה במערכת הייצור ומשתנה בכל שעה. הבטחת מלאי מהידע הזה היא
      עובדה תנודתית שנכתבה כעובדה קבועה — בדיוק מה שכלל 2 אוסר.
    patterns: [יש במלאי, במלאי, אזל, אזל המלאי, כמה יש לכם, תשמרו לי,
               תזמינו בשבילי, "יש לכם מספיק"]
    say_he: >-
      מלאי אני לא מאשר מכאן — אלכסנדר בודק מול המערכת ומאשר לך.
    escalate_to: alexander
    source: Sales-Machine/CLAUDE.md rule 2 + gt-factory-os stock-truth boundary
    date: '2026-08-31'
    authority: doc_confirmed

  - id: competitor_product
    severity: medium
    reason: >-
      אין לנו ידע מאומת על מוצר של מתחרה. השוואה מומצאת נבדקת ומפילה את
      האמון בכל השאר — בדיוק כמו השוואת הרווחיות המנופחת לקפה שהספר נמנע ממנה.
    patterns: [מתחרה, המתחרים, לעומת, במקום, "יותר טוב מ", מונין, monin,
               teapigs, "יש לי כבר של", אלטרנטיבה, "מה ההבדל בינכם"]
    say_he: >-
      על מוצר של חברה אחרת אני לא מתייחס. מה שאני כן יכול להראות: העלות למנה
      אצלנו, מה נפתח בתפריט עם בקבוק אחד, ומה הצוות צריך ללמוד — ותשווה בעצמך.
    escalate_to: alexander
    source: ספר העבודה §07 "כבר יש לי ספקים" + נגזרת §08
    date: '2026-08-31'
    authority: doc_confirmed

  - id: ingredient_origin_beyond_published
    severity: medium
    reason: >-
      מה שמותר לומר פורסם: ייצור בחולון, חומרי גלם מיובאים ישירות מהמגדלים.
      מעבר לזה — שם מגדל, מדינה מדויקת לכל רכיב, אחוזי תערובת — אין מקור מאומת.
    patterns: [מאיזה מטע, איזה מגדל, שם הספק, מאיפה בדיוק, מאיזו מדינה,
               אחוז, אחוזים, הרכב מדויק, נוסחה, "מה בדיוק יש בפנים"]
    say_he: >-
      מה שאני יכול לומר: מייצרים במפעל שלנו בחולון, וחומרי הגלם מיובאים ישירות
      מהמגדלים. פירוט מעבר לזה — אלכסנדר.
    escalate_to: alexander
    source: ספר העבודה §07 "איפה מייצרים" — הגבול של מה שפורסם
    date: '2026-08-31'
    authority: doc_confirmed

  - id: private_label_or_custom
    severity: medium
    reason: >-
      ידע שלילי: אין בשום מקור אישור שGT עושה מותג פרטי, טעם בהזמנה אישית או
      נפח מיוחד. סוכן ימציא בדיוק כאן.
    patterns: [מותג פרטי, private label, לייבל, טעם משלנו, בהתאמה אישית,
               מיוחד בשבילנו, נפח אחר, אריזה שלנו, "לייצר לי"]
    say_he: >-
      זה לא משהו שאני יכול לאשר. אני מעביר לאלכסנדר ותקבל תשובה ברורה.
    escalate_to: alexander
    source: ידע שלילי — אין מקור מאשר בשום קובץ מאושר (2026-08-31)
    date: '2026-08-31'
    authority: doc_confirmed

  - id: consumer_or_home_use
    severity: low
    reason: >-
      ליד פרטי ללא עסק מאחוריו הוא "לא קונה" לפי §05. תשובה קצרה ואדיבה עם
      קישור, וסגירה — ⊥ להשקיע, ו⊥ להמציא מחיר צרכני.
    patterns: [לבית, לשימוש ביתי, פרטי, אני לא עסק, "בשביל עצמי", "אין לי עסק",
               מתנה, "כמה זה לצרכן"]
    say_he: >-
      אנחנו מוכרים לבתי קפה ומסעדות בסיטונאות. לרכישה פרטית — gteveryday.com.
      שיהיה בהצלחה!
    escalate_to: null
    source: ספר העבודה §05 "לא קונה"
    date: '2026-08-31'
    authority: doc_confirmed

  - id: negative_record_product
    severity: high
    reason: >-
      MATCHA 50 גרם, GT ELITA 30 גרם, מקציף קוקטיילים, קנקן עם מסננת — רשומות
      שלילה של טום 2026-08-06. HOJICHA ו-AMERICAN — אין SKU פעיל. כולם עדיין
      מודפסים בספר עם מחיר. עד הכרעת טום (TOM-B/E) ⊥ מציעים ו⊥ מתמחרים.
    patterns: [הוג'יצ'ה, hojicha, "מאצ'ה שחורה", american, אמריקאית,
               "מאצ'ה 50", "אליטה 30", "gt elita", "מקציף קוקטיילים", "קנקן"]
    say_he: >-
      המוצר הזה לא נמצא כרגע במחירון הפעיל שלנו. אני מעביר לאלכסנדר שיבדוק אם
      הוא זמין ובאיזה מחיר.
    escalate_to: alexander
    source: catalog-truth.md §רשומות-שלילה (מאושר-טום 2026-08-06)
    date: '2026-08-06'
    authority: user_confirmed

  - id: unmatched_default
    severity: critical
    reason: ברירת המחדל. שאלה שלא נתפסה ואין לה שורה מאושרת — עוברת, לא נענית.
    patterns: ['*']
    say_he: >-
      שאלה טובה, ואני לא רוצה לענות עליה בערך. אני מעביר לאלכסנדר והוא חוזר
      אליך עם תשובה מדויקת.
    escalate_to: alexander
    source: Sales-Machine/CLAUDE.md rule 1 — inferred is never policy
    date: '2026-08-31'
    authority: doc_confirmed
