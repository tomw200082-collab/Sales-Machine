# GT customer & product notes — the living memory of the customer-product tracker.
#
# Purpose: everything worth remembering about an account between tracker rebuilds —
# identity decisions, closed businesses, churn reasons, "don't call before 10:00",
# supplier switches — so no rebuild rediscovers the same things.
#
# Contract (Sales-Machine rule 1 — every entry carries source, date, grade):
#   key    "tax:<ח.פ>" | "nm:<normalized name>"  — customer keys exactly as in the
#          tracker payload (gt-factory-os-production-brain/docs/analytics/) —
#          or "prod:<product name>" for products.
#   name   display name at write time (keys stay stable, names drift)
#   date   YYYY-MM-DD — never an undated fact (rule 2)
#   by     tom | claude
#   grade  user_confirmed | system_verified | inferred  (inferred is never policy)
#   text   free text. Hebrew welcome.
#   tags   optional: [identity], [closed], [churn-reason], [ops], ...
#
# Append-only. Corrections = a newer entry, never an edit.
#
# Consumers:
#   1. The tracker rebuild reads this file BEFORE computing (see
#      gt-factory-os-production-brain/docs/analytics/README.md): identity answers
#      merge/split customers, [closed] suppresses rescue-call moves, context notes
#      are baked into the dashboard's customer cards.
#   2. Tom writes new notes inside the dashboard itself; the page collects them and
#      produces a sync block ("סנכרון הערות") that any Claude session appends here.

