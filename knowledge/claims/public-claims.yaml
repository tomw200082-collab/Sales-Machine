# GT — כל טענה שנאמרת ללקוח, והראיה שמאחוריה.
# הכלל: טענה בלי מקור מאושר ⇒ authority: unsourced ⇒ ⊥ נאמרת ללקוח עד הכרעת טום.
# ⊥ "כנראה", ⊥ "סביר", ⊥ "כך תמיד אמרנו". מקור = נתיב קובץ או שאילתה, ותאריך.
card:
  id: claims/public-claims
  title: טענות פומביות — מה מותר להגיד ומה הראיה
  type: claims-register
  authority: per-entry
  date: 2026-08-31
  freshness: review_30d
  source: ספר העבודה 2026-08-31 + בדיקה חיה מול Shopify + docs/warehouses/catalog-truth.md

claims:
  - id: cost_20_to_1
    text_he: כוס חליטה קרה עולה ₪3.25 ונמכרת ב-₪20 — רווח 81% על ההכנסה נטו
    status: approved
    evidence: >-
      drinks_final_figures.json p.8 (cost ₪3.25 · price ₪20 · marg 81%);
      הרווח נגזר מהנוסחה ⊥ נטען: (20/1.18 − 3.25)/(20/1.18) = 81%
    source: .claude/skills/drinks-pricelist/drinks_final_figures.json
    date: '2026-08-27'
    authority: system_verified

  - id: less_profitable_than_coffee
    text_he: קצת פחות רווחי מקפה, משמעותית יותר רווחי ממשקה מוכן מהמקרר
    status: approved
    evidence: >-
      נוסח מכוון-חסר. הספר מסרב לנפח את ההשוואה לקפה, ובצדק: בעל מסעדה יבדוק
      מספר מנופח ויפסיק להאמין לשאר. אין ולא נדרש מספר משווה — הטענה איכותית.
    source: ספר העבודה §02 + §07 "זה רווחי?"
    date: '2026-08-31'
    authority: doc_confirmed

  - id: no_additives
    text_he: ללא חומרים משמרים, ללא צבעי מאכל, ללא תמציות טעם
    status: approved
    evidence: הופיע בקטלוג המוצרים 2026 ובספר; נאמר ללקוחות שנים
    source: ספר העבודה §01 + §07
    date: '2026-08-31'
    authority: doc_confirmed
    upgrade_to: system_verified כשיצורף מפרט מוצר / תווית

  - id: made_in_holon
    text_he: מייצרים במפעל שלנו בחולון; חומרי הגלם מיובאים ישירות מהמגדלים
    status: approved
    evidence: זהות החברה — gt-factory-os-production-brain/CLAUDE.md §Identity ("small beverage factory, Israel")
    source: ספר העבודה §01 + brain CLAUDE.md
    date: '2026-08-31'
    authority: doc_confirmed

  - id: kashrut_badatz
    text_he: כל המוצרים כשרים בד״ץ בית יוסף, בהשגחת הרבנות חולון
    status: approved
    evidence: >-
      **טום אישר בכתב 2026-08-31: "אין מסמכים — אני מאשר את שניהם כעובדה".**
      אין תעודה סרוקה ואין מספר תעודה בשום קובץ בשני המאגרים (נבדק 2026-08-31).
      לקוח שיבקש לראות תעודה — עובר לאלכסנדר, כי אין מה לשלוח לו.
    source: טום, בכתב, 2026-08-31
    date: '2026-08-31'
    authority: user_confirmed

  - id: shelf_life
    text_he: >-
      תמציות: שנה סגור, ללא צורך בקירור; אחרי פתיחה — שלושה חודשים בקירור.
      אבקות: שנתיים.
    status: approved
    evidence: >-
      **טום אישר בכתב 2026-08-31 כעובדה.** אין מפרט יציבות ואין תווית מוצר בשום
      קובץ (נבדק 2026-08-31); המספרים הם ידיעתו.
    source: טום, בכתב, 2026-08-31
    date: '2026-08-31'
    authority: user_confirmed

  - id: calories_17
    text_he: כ-17 קלוריות ל-100 מ״ל משקה מוכן
    status: withheld
    evidence: >-
      ⊥ נמצא מקור. אין טבלת סימון תזונתי בשום קובץ מאושר. ערך תזונתי הוא בדיוק
      מה שמסעדה מצטטת ללקוח — ⊥ נאמר עד שיש מקור.
    open_item: CLAIM-3
    replacement_he: >-
      התמציות זמינות עם מעט סוכר או ללא סוכר כלל. ערך תזונתי מדויק — אלכסנדר.
    source: ספר העבודה §07 "יש סוכר"
    date: '2026-08-31'
    authority: unsourced

  - id: customers_700
    text_he: כ-700 לקוחות
    status: approved
    evidence: >-
      **טום אישר בכתב 2026-08-31** — המספר שלו, על אחריותו.
      לפרוטוקול, מה שמערכות המדידה מראות: 12 חודשים אחרונים **599** לקוחות
      מזמינים (ShopifyQL חי, 2026-08-31) · 25 חודשים **804**
      (evidence/2026-08-24-sales-report.md) · מאז 2015 **3,239**.
      אף אחד מהם אינו 700, ולכן זו טענת בעלים ⊥ נתון מערכת — וכך היא מדורגת.
    source: טום, בכתב, בסשן 2026-08-31
    date: '2026-08-31'
    authority: user_confirmed

  - id: years_8
    text_he: 8 שנים בשוק
    status: approved
    evidence: >-
      **טום אישר בכתב 2026-08-31.** אין מקור מסמכי לתאריך ההקמה בשום קובץ, וחנות
      Shopify מכילה הזמנות מ-2015 — אבל ותק החנות ⊥ ותק החברה, וטום הוא המקור.
    source: טום, בכתב, בסשן 2026-08-31
    date: '2026-08-31'
    authority: user_confirmed

  - id: named_customers
    text_he: 'לקוחות לציטוט: R2M, קבוצת קיסו, נונו מימי, ויוינו, אליטה אופק, בבקה'
    status: approved
    evidence: >-
      **טום 2026-08-31: "כל השישה — יש לי רשות מכולם".** רשות הפרסום היא שלו.
      ארבעה מהשמות מאומתים גם כלקוחות בטבלת העובדות 2026-08-24: נונומימי ₪471,938
      (₪533,089 עם נונו ג'ירף) · עלית אופק ₪516,241 · R2M ₪132,976 · בבקה.
      `קבוצת קיסו` ו`ויוינו` ⊥ מופיעים בעמודי הרשתות של אותה ראיה — הרשות שלהם
      נשענת על טום בלבד, וזה מספיק.
    source: טום, בכתב, 2026-08-31 + evidence/2026-08-24-sales-report.md
    date: '2026-08-31'
    authority: user_confirmed

  - id: distributor_ice_dream
    text_he: >-
      אספקה לכל הארץ דרך המפיץ אייס דרים. מרכז — ראשון, שני וחמישי.
      צפון — שלישי. דרום — רביעי.
    status: approved
    evidence: >-
      **טום, בכתב 2026-08-31:** "ימים ראשון, שני וחמישי זה למרכז, יום שלישי צפון
      ויום רביעי דרום". זה לוח חלוקה, ⊥ הבטחת תאריך: **מתי הזמנה מסוימת נוחתת
      תלוי גם בשעת הקליטה, וזו ⊥ מוגדרת.** לכן מותר לומר את הימים ו⊥ לנקוב
      בתאריך להזמנה ספציפית — ראה boundaries/refusals#delivery_date.
    source: טום, בכתב, 2026-08-31
    date: '2026-08-31'
    authority: user_confirmed

  - id: minimum_order_800
    text_he: מינימום הזמנה ₪800 בתוספת מע״מ
    status: approved
    evidence: מופיע בספר פעמיים (§02 המספרים, §07 בנק התשובות) — עקבי
    source: ספר העבודה §02 + §07
    date: '2026-08-31'
    authority: doc_confirmed

  - id: training_videos
    text_he: לכל מוצר ולכל משקה יש סרטון הדרכה, ואיתם חוברת משקאות עם הוראות הכנה ותמחור
    status: approved
    evidence: >-
      מופיע בספר §05 שלב 06 ו-§07. חוברת המשקאות = "קטלוג משקאות סופי 26" —
      הקטלוג היחיד בתוקף מבין ארבעה בקנבה (§09).
    source: ספר העבודה §05 + §07 + §09
    date: '2026-08-31'
    authority: doc_confirmed
    caution: ⊥ לשלוח אף אחד משלושת הקטלוגים האחרים

  - id: single_bottle_11_drinks
    text_he: בקבוק NAMASTEA אחד ב-₪65 פותח 11 משקאות
    status: approved
    evidence: >-
      נספר מ-drinks/catalog.yaml — category "צ'אי" = 11 משקאות, כולם על בסיס
      NAMASTEA. נבדק ע"י scripts/knowledge/reconcile.py.
    source: knowledge/drinks/catalog.yaml
    date: '2026-08-27'
    authority: system_verified

  - id: matcha_per_serving_2_13
    text_he: פחית מאצ'ה 500 גרם ב-₪590 היא ₪2.13 למנה
    status: approved
    evidence: 590 ÷ 277 מנות (1.8 גרם למנה) = ₪2.13
    source: knowledge/products/catalog.yaml · GT-SHI-CER-500
    date: '2026-08-06'
    authority: doc_confirmed

  - id: no_commitment
    text_he: >-
      אין חוזה, אין מינימום חודשי ואין בלעדיות. ההתחייבות היחידה היא מינימום
      הזמנה של ₪800 בתוספת מע״מ.
    status: approved
    evidence: >-
      **טום, בכתב 2026-08-31:** "יש רק מינימום הזמנה — 800 ש\"ח + מע\"מ".
      זו נקודת מכירה, ⊥ רק היעדר מידע: היא התשובה הישירה ל"אני חושש שזה לא יצליח".
      במסלול האשראי כן נדרשים מסמכים וערבויות אישיות — זה תנאי אשראי, ⊥ התחייבות
      רכש, ואת גובהו קובע אלכסנדר.
    source: טום, בכתב, 2026-08-31
    date: '2026-08-31'
    authority: user_confirmed

  - id: vat_presentation
    text_he: >-
      מחיר שנאמר לבעל עסק הוא תמיד **ללא מע״מ**. מחיר שנוגע למה שהעסק מוכר
      ללקוח הקצה שלו — נאמר **כולל מע״מ**.
    status: approved
    evidence: >-
      **טום, בכתב 2026-08-31:** "אנחנו תמיד כותבים מחירים לבעלי עסקים במחיר ללא
      מע\"מ... אם זה קשור למה שהעסקים עצמם מוכרים ללקוחות קצה אפשר לכתוב את
      המחיר כולל מע\"מ כבר". זה בדיוק המבנה שכבר קיים בנתונים: המחירון
      (products/catalog.yaml) ללא מע״מ, והמחיר המומלץ ב-48 המשקאות כולל מע״מ 18%.
    applies_to:
      exvat: [products/catalog.yaml, מחירון, מינימום הזמנה]
      vat_inclusive: [drinks/catalog.yaml — מחיר מומלץ לצרכן]
    source: טום, בכתב, 2026-08-31
    date: '2026-08-31'
    authority: user_confirmed
