card:
  id: story/chapters
  title: פרקי הפרוזה של ספר העבודה
  type: prose
  authority: per-entry
  date: 2026-08-31
  freshness: stable
  source: ספר העבודה 2026-08-31 (ארטיפקט f0457ed1), הטקסט כפי שנמסר ע"י טום בסשן

chapters:
  - id: hero
    eyebrow: ספר עבודה · שיווק ומכירות
    title: קטגוריה שלמה בין הקפה למקרר
    lede: >-
      כל מה שצריך כדי לענות ללקוח מסעדה — מהרגע שהליד נכנס ועד ההזמנה הראשונה.
      מוצרים, מספרים, נוסחים ותשובות.
    source: ספר העבודה — כותרת
    date: '2026-08-31'
    authority: doc_confirmed

  - id: what_we_sell
    number: '01'
    title: מה אנחנו מוכרים
    paragraphs:
      - >-
        GT מייצרת בחולון תמציות תה טבעיות ומייבאת אבקות מאצ'ה ואובה. הלקוחות הם
        בתי קפה ומסעדות — ואנחנו לא מוכרים להם מוצר, אלא קטגוריה שלמה בתפריט.
      - >-
        הקטגוריה יושבת במקום שהיה ריק: בין הקפה למשקאות המוכנים מהמקרר. משקאות
        מיוחדים שמכינים במקום, מהר ובאיכות גבוהה. היא קצת פחות רווחית מקפה,
        ומשמעותית יותר רווחית מפחית.
      - >-
        המוצרים ללא חומרים משמרים, ללא צבעי מאכל וללא תמציות טעם. חומרי הגלם
        מיובאים ישירות מהמגדלים, והייצור והיבוא נמצאים תחת קורת גג אחת.
      - >-
        שתי קטגוריות מוצר — תמציות תה ואבקות — ובנוסף מוצרים נלווים: מחיות פרי
        ועזרי הכנה. שלוש קטגוריות משקה: תה, צ'אי ואבקות.
    source: ספר העבודה §01
    date: '2026-08-31'
    authority: doc_confirmed

  - id: liquid_vs_powder
    title: הקו שחשוב להבין
    lede: ההבדל התפעולי האמיתי אינו בין הטעמים — הוא בין נוזל לאבקה.
    columns:
      - label: נוזל
        sub: תה וצ'אי
        text: >-
          אותו בקבוק, מנה של 50 מ״ל, עלות ₪3.25, ופעולה אחת — לשפוך. ברמן שיודע
          להכין חליטה קרה כבר יודע להכין צ'אי. לא צריך ללמד כלום, רק לתת בקבוק שני.
      - label: אבקה
        sub: מאצ'ה ואובה
        text: >-
          קודם מכינים בסיס — 1.8 גרם מאצ'ה או 2 גרם אובה ב-50 מ״ל מים. צריך מקציף
          או מטרפה, וחלב. לכן הצעת אבקות תמיד כוללת את הציוד, ולא מציעה אותו
          בנפרד אחר כך.
    source: ספר העבודה §01
    date: '2026-08-31'
    authority: doc_confirmed

  - id: numbers_note
    number: '02'
    title: המספרים
    lede: אלה המספרים שסוגרים עסקה. שווה לדעת אותם בעל פה.
    footnote: עלות התמצית בלבד — מים, קרח וגרניש אינם מתומחרים.
    callout: >-
      תמיד להוביל במספר למנה. פחית מאצ'ה ב-₪590 נשמעת יקרה, אבל היא ₪2.13 למנה.
      לקוח שרואה ₪590 קודם נושר לפני שהבין.
    source: ספר העבודה §02
    date: '2026-08-31'
    authority: doc_confirmed

  - id: pricelist_note
    number: '03'
    title: מחירון מוצרים
    lede: >-
      עשר תמציות באותו מחיר בדיוק, בשני נפחים. אין הפרש מחיר בין טעמים — נקודה
      שמפשטת כל שיחת מכירה.
    changed_from_book: >-
      הספר אמר "11 תמציות". שש שורות שהיו במחירון ירדו ממנו עד הכרעת טום —
      ארבע רשומות-שלילה ושתיים בלי SKU פעיל, ובהן AMERICAN. הן מופיעות למטה
      בנפרד, עם הסיבה.
    source: ספר העבודה §03
    date: '2026-08-31'
    authority: doc_confirmed

  - id: drinks_note
    number: '04'
    title: 48 המשקאות
    lede: >-
      עלות רכיבים ללא מע״מ, ללא גרניש · מחיר מומלץ כולל מע״מ 18% · רווח על
      ההכנסה נטו. שתי מנות בסיס חוזרות: בסיס מאצ'ה — 1.8 גרם ב-50 מ״ל מים;
      בסיס אובה — 2 גרם ב-50 מ״ל מים.
    source: ספר העבודה §04
    date: '2026-08-31'
    authority: doc_confirmed

  - id: lead_note
    number: '05'
    title: הליד
    lede: >-
      שאלה אחת בתחילת השיחה ממיינת בין שלושת הסוגים. בלי המיון הזה כל השאר מבוזבז.
    source: ספר העבודה §05
    date: '2026-08-31'
    authority: doc_confirmed

  - id: send_note
    number: '06'
    title: מה שולחים
    lede: >-
      קמפיין לכל קטגוריה, וערכה שמתאימה לו. ליד שהגיע ממודעת מאצ'ה מקבל מאצ'ה
      בלבד — מי שמחפש דבר אחד ומקבל עשרה לא מרגיש שקיבל יותר, אלא שלא הבינו אותו.
    source: ספר העבודה §06
    date: '2026-08-31'
    authority: doc_confirmed

  - id: answers_note
    number: '07'
    title: בנק התשובות
    lede: >-
      אלה התשובות שמותר לתת. שאלה שאינה כאן עוברת לאלכסנדר — גם אם נראה שאפשר
      להסיק את התשובה.
    source: ספר העבודה §07
    date: '2026-08-31'
    authority: doc_confirmed

  - id: boundaries_note
    number: '08'
    title: הגבולות
    lede: הפרק החשוב בספר. תשובה שגויה ללקוח מסעדה עולה יותר מתשובה מאוחרת.
    callouts:
      - title: אלרגנים — למה זה חמור
        text: >-
          במחירון יש מחית פיסטוק ומשקה שומשום שחור, ושניהם אלרגנים מוכרזים.
          מסעדה מסתמכת על מה שאנחנו אומרים כדי לענות לסועד עם אלרגיה. לכן לא
          עונים — גם לא "נראה לי שאין". מעבירים.
      - title: טענות בריאות
        text: >-
          DETOX הוא שם מותג, וזה בסדר. משפט שמבטיח מה המשקה עושה לגוף —
          "מנקה רעלים", "מחזק חסינות" — הוא חשיפה רגולטורית. לא אומרים ולא כותבים.
    source: ספר העבודה §08
    date: '2026-08-31'
    authority: doc_confirmed

  - id: open_note
    number: '09'
    title: עוד לא סגור
    lede: >-
      ארבע החלטות מסחריות שאין להן עדיין תשובה, שש שורות מחירון שמחכות להכרעה,
      ושלוש טענות שנאמרו ללקוחות בלי מקור. אף אחת מהן לא נסגרת במחקר.
    source: ספר העבודה §09, מורחב 2026-08-31
    date: '2026-08-31'
    authority: doc_confirmed

