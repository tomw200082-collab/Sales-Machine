# GT — רצף השיחה ומה שולחים. הספר §05 ו-§06, כנתונים.
card:
  id: segments/sales-motion
  title: רצף הליד, מה שולחים, ולאן מרחיבים
  type: playbook
  authority: per-entry
  date: 2026-08-31
  freshness: review_30d
  source: ספר העבודה §05 + §06
  principles:
    - המטרה היא הזמנה ראשונה, ⊥ פגישה.
    - ההתנגדות האמיתית היא אינרציה, ⊥ מחיר.
    - אף חומר ⊥ נשלח לפני שביקשו אותו.

stages:
  - id: s01_sort
    when: 0–5 דקות
    name_he: מענה מיידי ושאלה אחת
    do_he: ⊥ להסביר, ⊥ לשלוח כלום. למיין. שאלה אחת בלבד.
    why_he: יותר משאלה אחת מוריד את שיעור המענה בחדות.
    script_he: >-
      היי [שם], הגעת ל-GT everyday. אנחנו מייצרים תמציות תה טבעיות ומספקים
      לבתי קפה ומסעדות. לפני שאני שולח לך חומר — איזה עסק יש לך, ואיפה?
    source: ספר העבודה §05
    date: '2026-08-31'
    authority: doc_confirmed
  - id: s02_explain
    when: מיד אחרי שענה
    name_he: ההסבר האנושי
    shape_he: שלוש שורות שבן אדם עסוק קורא בעמידה, ומספר אחד שנתקע לו בראש. מסתיים בבקשת רשות.
    script_he: >-
      אנחנו מפעל בחולון שמייצר תמציות תה טבעיות — עלי תה וצמחים שאנחנו מביאים
      ישירות מהמגדלים. בלי חומרים משמרים, בלי צבעי מאכל, בלי תמציות טעם.
      ההכנה: כוס, קרח, 50 מ״ל תמצית, מים או סודה. עשר שניות, בלי מכונה ובלי
      מקום במקרר. הקטגוריה יושבת בין הקפה למשקאות מהמקרר — קצת פחות רווחית
      מקפה, הרבה יותר רווחית מפחית. כוס עולה לך ₪3.25 ונמכרת ב-₪20.
      רוצה שאשלח לך את המשקאות?
    changed_from_book: >-
      הוסר המשפט "אנחנו 8 שנים בשוק, עם כ-700 לקוחות — בהם R2M, קבוצת קיסו,
      נונו מימי ובבקה". שני המספרים unsourced (claims#customers_700,
      claims#years_8) ושניים מהשמות ⊥ אומתו (claims#named_customers).
      עד הכרעת טום (TOM-C, TOM-D) — ⊥ נאמר.
    status: טיוטה
    source: ספר העבודה §05 שלב 02
    date: '2026-08-31'
    authority: doc_confirmed
  - id: s03_send_kit
    when: אחרי "כן"
    name_he: שולחים ערכה, ⊥ קטלוג
    do_he: >-
      שלושה מתכונים מהקטגוריה שהביאה אותו — ⊥ 48 משקאות. ליד ממודעת מאצ'ה
      מקבל מאצ'ה בלבד.
    why_he: מי שמחפש דבר אחד ומקבל עשרה ⊥ מרגיש שקיבל יותר, אלא שלא הבינו אותו.
    also_he: כדאי להזכיר כאן את ההדרכה — זו התשובה הישירה ל"הצוות שלי לא ילמד".
    source: ספר העבודה §05 + §06
    date: '2026-08-31'
    authority: doc_confirmed
  - id: s04_answer
    when: שיחה פתוחה
    name_he: עונים על שאלות
    do_he: מבנק התשובות בלבד. מה שאין בבנק — עובר לאלכסנדר, ⊥ ממציאים.
    source: ספר העבודה §05
    date: '2026-08-31'
    authority: doc_confirmed
  - id: s05_ask_for_order
    when: כשהשיחה בשלה
    name_he: מבקשים את ההזמנה
    do_he: הצעה מוגדרת שאפשר לאשר בהודעה — ⊥ "בוא נדבר".
    blocked_by: TOM-A.1
    blocked_note: >-
      תוכן ומחיר החבילות ⊥ סגורים. עד שיהיו — ⊥ מציעים חבילה ספציפית, מעבירים
      לאלכסנדר. אפשר לומר שהמינימום ₪800 + מע״מ ושהחבילה עומדת בו.
    source: ספר העבודה §05 שלב 05 + §09
    date: '2026-08-31'
    authority: doc_confirmed
  - id: s06_training
    when: אחרי ההזמנה
    name_he: ההדרכה
    why_he: >-
      ⊥ שירות אחרי מכירה — חלק מהמכירה. מקום שקיבל ארגז ולא יודע להכין נכון
      יפסיק להזמין תוך חודש.
    source: ספר העבודה §05 שלב 06
    date: '2026-08-31'
    authority: doc_confirmed

follow_ups:
  - day: 2
    name_he: תזכורת קצרה
    rule_he: בלי התנצלות ובלי חזרה על מה שכבר נאמר.
    script_he: שלחתי לך אתמול את המשקאות. יש משהו שאני יכול לענות עליו?
    source: ספר העבודה §05
    date: '2026-08-31'
    authority: doc_confirmed
  - day: 5
    name_he: ערך, ⊥ דחיפה
    script_he: >-
      משקה אחד שכמעט כל מקום מתחיל ממנו — חליטת היביסקוס וליים. עלות ₪3.25,
      נמכר ב-₪20, נטול קפאין, בצבע אדום שנראה טוב על השולחן. המתכון: קרח,
      50 מ״ל תמצית FRESH, מים או סודה, סלייס לימון.
    source: ספר העבודה §05 · drinks/catalog.yaml p.8
    date: '2026-08-31'
    authority: doc_confirmed
  - day: 12
    name_he: סגירת מעגל
    why_he: מקבלת הכי הרבה תשובות מהשלוש, כי היא משחררת.
    script_he: >-
      לא רוצה להציק. אם זה לא רלוונטי עכשיו — תגיד ואסגור אצלי. ואם זה עניין
      של תזמון, מתי כדאי לחזור?
    source: ספר העבודה §05
    date: '2026-08-31'
    authority: doc_confirmed
  - day: after_12
    name_he: עוצרים
    rule_he: שלוש נגיעות ואז עוצרים. תזכורת שחוזרת על עצמה נקראת כרדיפה.
    source: ספר העבודה §05
    date: '2026-08-31'
    authority: doc_confirmed

expansion_map:
  - id: tea_chai
    from: תה
    to: צ'אי
    cost_to_customer_he: בקבוק שני. אפס ציוד, אפס למידה.
    why_he: אותו בקבוק, אותה מנה, אותה פעולה. המכירה השנייה הזולה ביותר, לשני הכיוונים.
    source: ספר העבודה §06
    date: '2026-08-31'
    authority: doc_confirmed
  - id: within_tea
    from: חליטה
    to: לימונדה ← גזוז
    cost_to_customer_he: אפס מוצר חדש — רק מתכונים בהודעה.
    source: ספר העבודה §06
    date: '2026-08-31'
    authority: doc_confirmed
  - id: matcha_ube
    from: מאצ'ה
    to: אובה
    cost_to_customer_he: אותה שיטת בסיס, אותו מקציף, אותו חלב. 70 אגורות למנה.
    caution: אובה ⊥ עומד לבד — כל 5 משקאותיו דורשים מוצר שני.
    source: ספר העבודה §06 · products/catalog.yaml (requires_second_product)
    date: '2026-08-31'
    authority: doc_confirmed
  - id: powder_plus_chai
    from: אבקות + נמסטאה
    to: אין מה למכור
    what_he: >-
      מקום שיש לו גם נמסטאה וגם אבקה מקבל שני משקאות נוספים בחינם — אייס
      מאצ'ה מסאלה ואייס אובה מסאלה. יש מה לספר, ⊥ מה למכור — וזו סיבה טובה
      לשלוח הודעה.
    source: ספר העבודה §06 · drinks/catalog.yaml p.33, p.63
    date: '2026-08-31'
    authority: doc_confirmed
  - id: any_to_puree
    from: כל קטגוריה
    to: מחיות פרי
    what_he: מחית אחת ב-₪60 מוסיפה משקאות גם בתה וגם באבקות. ההרחבה הרוחבית היחידה.
    source: ספר העבודה §06
    date: '2026-08-31'
    authority: doc_confirmed
  - id: timing_rule
    from: כלל
    to: כלל
    what_he: >-
      ההרחבה נקנית ב"כן", ⊥ בזמן: מציעים אחרי שהזמין, או אחרי שהוא שאל
      מיוזמתו. והכיוון — לכיוון שדורש הכי פחות מהבר, ⊥ לכיוון שדומה בטעם.
    source: ספר העבודה §06
    date: '2026-08-31'
    authority: doc_confirmed
